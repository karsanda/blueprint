# PROTOTYPE — Tauri backend for the Blueprint feasibility prototype. Throwaway.
[package]
name = "blueprint-proto-tauri"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde_json = "1"
portable-pty = "0.9"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
