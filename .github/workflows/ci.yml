name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Links, format, lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/check_links_integrity.sh
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm can skip Electron's postinstall; this fetches the Electron binary when it is missing.
      - run: node node_modules/electron/install.js
      - name: Install a virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      # Electron needs a screen: the tests run in a virtual X display.
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
