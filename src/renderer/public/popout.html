<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The same policy as index.html: the page runs no script of its own, and takes nothing from elsewhere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:"
    />
    <title>Blueprint</title>
  </head>
  <body></body>
</html>
